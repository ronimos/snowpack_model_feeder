[GENERAL]
BUFFER_SIZE=370
BUFF_BEFORE=1.5

[INPUT]
TIME_ZONE=0
COORDSYS=UTM
COORDPARAM=10T
METEOPATH=WRFIN
METEO=SMET
SNOWFILE1=WRFPT
SNOW=SMET
SNOWFILE1=WRFPT

[INTERPOLATIONS1D]
PSUM::RESAMPLE1=ACCUMULATE
PSUM::ARG1::PERIOD=900

[INPUTEDITING]
*::EDIT1=CREATE
*::ARG1::PARAM=TSG
*::ARG1::ALGORITHM=CST
*::ARG1::VALUE=273.15

[OUTPUT]
METEO=SMET
METEOPATH=WRFOUT
EXPERIMENT=res
TS_WRITE=TRUE
TS_FORMAT=SMET
TS_START=0.0
TS_DAYS_BETWEEN=0.25
PROFILE_FORMAT=PRO
PROF_WRITE=TRUE
PROF_START=0.0
PROF_DAYS_BETWEEN=0.25        ; output every six hours
PROF_AGE_OR_DATE=DATE
TIME_ZONE=0

[SNOWPACK]
ATMOSPHERIC_STABILITY=NEUTRAL
CALCULATION_STEP_LENGTH=15
CANOPY=FALSE
CHANGE_BC=FALSE
MEAS_TSS=FALSE
ENFORCE_MEASURED_SNOW_HEIGHTS=TRUE
HEIGHT_OF_METEO_VALUES=2
HEIGHT_OF_WIND_VALUE=10
ROUGHNESS_LENGTH=0.002
SNP_SOIL=FALSE
SW_MODE=INCOMING

[SNOWPACKADVANCED]
NUMBER_SLOPES=5
ALLOW_ADAPTIVE_TIMESTEPPING=TRUE
T_CRAZY_MIN=130

[GENERATORS]
PSUM_PH::GENERATORS=PRECSPLITTING
PSUM_PH::PRECSPLITTING::TYPE=THRESH
PSUM_PH::PRECSPLITTING::snow = 274.35
